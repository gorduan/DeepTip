[package]
name = "deeptip-ratatui"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "DeepTip for Ratatui: explanation windows with depth (nested, pinnable, Paradox-style tooltips) in the terminal, driven by JSON glossaries"
license = "MIT"
authors = ["Gorduan"]
keywords = ["ratatui", "tui", "tooltip", "glossary", "terminal"]
categories = ["command-line-interface", "game-development"]
readme = "README.md"

[dependencies]
# The pure core of the Rust implementation (glossary, markup parser, placement, window tree), without egui.
deeptip = { path = "../rust-egui", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-segmentation = "1"
unicode-width = "0.2"
log = "0.4"

[dev-dependencies]
serde_json = "1"
